<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Launch Codes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <script
      src="https://kit.fontawesome.com/9cde1143cd.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav>
      <span class="nav-title">
        <h2>Welcome to <span class="hghlt">Career Launch Codes</span></h2>
      </span>
      <ul class="nav-links">
        <li><a href="#Job-Search" class="nav__link">Job Search</a></li>
        <li><a href="#Learning" class="nav__link">Learning</a></li>
        <li><a href="#Interview-Prep" class="nav__link">Interview Prep</a></li>
        <li><a href="#Start-Ups" class="nav__link">Start-Ups</a></li>
        <li><a href="#Get-Started" class="nav__link">Get Started</a></li>
      </ul>
    </nav>
    <main>
      <div id="landing">
        <div class="land-wrap">
          <header>
            <p class="slogan">AD LUNAM ET ULTRA</p>
          </header>

          <a href="#" class="toggle" onmouseclick="toggleDarkMode()">
            <i class="fa-solid fa-circle-half-stroke"></i
          ></a>

          <div class="background__img--container">
            <div class="banner">
              <div class="slider" style="--quantity: 8">
                <div class="item" style="--position: 1">
                  <img src="./assets/html.png" alt="" />
                </div>
                <div class="item" style="--position: 2">
                  <img src="./assets/s.png " alt="" />
                </div>
                <div class="item" style="--position: 3">
                  <img
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/CSS3_logo.svg/240px-CSS3_logo.svg.png"
                    alt=""
                  />
                </div>
                <div class="item" style="--position: 4">
                  <img src="./assets/mysql.png" alt="" />
                </div>
                <div class="item" style="--position: 5">
                  <img src="./assets/javascript.png" alt="" />
                </div>
                <div class="item" style="--position: 6">
                  <img src="./assets/visual-studio.png" alt="" />
                </div>
                <div class="item" style="--position: 7">
                  <img src="./assets/react copy.png" alt="" />
                </div>
                <div class="item" style="--position: 8">
                  <img src="./assets/sql.png" alt="" />
                </div>
              </div>
            </div>

            <figure class="landing__img--darkbackground" onclick="toggleDarkMode">
              <img
                src="./assets/moon-landing-page.jpg"
                class="landing__img--dark"
                alt="Background Image"
              />
            </figure>

            <figure class="landing__facade--dark" onclick="toggleDarkMode">
              <img
                src="./assets/moon-landing-page(1).png"
                class="facade__img--dark" onclick="toggleDarkMode"
                alt="background image overlay 3d effecrt dark-mode"
              />
            </figure>
            <figure class="landing__facade--light" onclick="toggleDarkMode">
              <img
                src="./assets/moon-4476029_1280(f).png"
                class="facade__img--light" onclick="toggleDarkMode"
                alt="background image overlay 3d effect light-mode"
              />
            </figure>
          </div>
        </div>
      </div>
    </main>
    <div id="job-search" onclick="toggleDarkMode">
      <div class="job__search--title">
        <h1>
          <span class="hghlt">Launch</span> Your New Career Start Searching
          <span class="hghlt">Today</span>
        </h1>
      </div>
      <div class="job__search--desc">
        <p></p>
        <div class="rating-container">
          <span>GREAT</span>
          <figure class="rating__stars--img">
            <img src="./assets/trust-pilot-rating.svg" class="stars--img" />
          </figure>
          <span> 4.1 OUT OF 5 STARS</span>
          <figure class="trust-pilot__logo">
            <img
              src="./assets/trust-poilot-black.svg"
              class="trust-pilot__img"
            />
          </figure>
        </div>
      </div>
    </div>

    <footer>
      <p>&copy; 2024 Career Launcher Code. All rights reserved.</p>
    </footer>
  </body>
</html>
